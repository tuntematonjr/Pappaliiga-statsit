<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API v3.1 Test Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            padding: 2rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(90deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .section h2 {
            margin-bottom: 1rem;
            color: #4ecdc4;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-right: 0.5rem;
            margin-bottom: 0.5rem;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        pre {
            background: #000;
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 0.875rem;
            line-height: 1.5;
            max-height: 400px;
            overflow-y: auto;
        }

        .status {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-left: 0.5rem;
        }

        .status.success {
            background: rgba(76, 217, 100, 0.2);
            color: #4cd964;
        }

        .status.error {
            background: rgba(255, 59, 48, 0.2);
            color: #ff3b30;
        }

        .status.loading {
            background: rgba(255, 204, 0, 0.2);
            color: #ffcc00;
        }

        .result-container {
            margin-top: 1rem;
            min-height: 100px;
        }

        .endpoint-info {
            background: rgba(0, 0, 0, 0.2);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 1rem;
        }

        .card h3 {
            margin-bottom: 0.5rem;
            color: #4ecdc4;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Pappaliiga Stats API v3.1 Test Page</h1>
        
        <!-- Health Check -->
        <div class="section">
            <h2>Health Check</h2>
            <div class="endpoint-info">GET /api/health</div>
            <button onclick="testHealth()">Test Health Endpoint</button>
            <span id="health-status"></span>
            <div id="health-result" class="result-container"></div>
        </div>

        <!-- Seasons List -->
        <div class="section">
            <h2>Seasons List</h2>
            <div class="endpoint-info">GET /api/seasons</div>
            <button onclick="testSeasonsList()">Load Seasons</button>
            <span id="seasons-status"></span>
            <div id="seasons-result" class="result-container"></div>
        </div>

        <!-- Season Summary -->
        <div class="section">
            <h2>Season Summary</h2>
            <div class="endpoint-info">GET /api/seasons/{season_id}/summary</div>
            <label for="season-id">Season ID:</label>
            <input type="number" id="season-id" value="11" style="padding: 0.5rem; border-radius: 4px; border: 1px solid #ccc; margin: 0 0.5rem;">
            <button onclick="testSeasonSummary()">Load Summary</button>
            <span id="summary-status"></span>
            <div id="summary-result" class="result-container"></div>
            <div id="summary-visual" class="result-container"></div>
        </div>

        <!-- Season Divisions -->
        <div class="section">
            <h2>Season Divisions</h2>
            <div class="endpoint-info">GET /api/seasons/{season_id}/divisions</div>
            <label for="divisions-season-id">Season ID:</label>
            <input type="number" id="divisions-season-id" value="11" style="padding: 0.5rem; border-radius: 4px; border: 1px solid #ccc; margin: 0 0.5rem;">
            <button onclick="testSeasonDivisions()">Load Divisions</button>
            <span id="divisions-status"></span>
            <div id="divisions-result" class="result-container"></div>
        </div>

        <!-- Division Stats -->
        <div class="section">
            <h2>Division Detailed Stats</h2>
            <div class="endpoint-info">GET /api/seasons/{season_id}/divisions/{division_id}/stats</div>
            <label for="stats-season-id">Season ID:</label>
            <input type="number" id="stats-season-id" value="11" style="padding: 0.5rem; border-radius: 4px; border: 1px solid #ccc; margin: 0 0.5rem;">
            <label for="division-id">Division ID:</label>
            <input type="text" id="division-id" value="" placeholder="e.g., 1-abc123" style="padding: 0.5rem; border-radius: 4px; border: 1px solid #ccc; margin: 0 0.5rem; min-width: 200px;">
            <button onclick="testDivisionStats()">Load Stats</button>
            <span id="stats-status"></span>
            <div id="stats-result" class="result-container"></div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        function setStatus(id, status, message = '') {
            const el = document.getElementById(id);
            el.className = `status ${status}`;
            el.textContent = message || status;
        }

        function showResult(id, data, error = null) {
            const el = document.getElementById(id);
            if (error) {
                el.innerHTML = `<pre style="color: #ff3b30;">${JSON.stringify(error, null, 2)}</pre>`;
            } else {
                el.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            }
        }

        async function testHealth() {
            setStatus('health-status', 'loading', 'Loading...');
            try {
                const response = await fetch(`${API_BASE}/api/health`);
                const data = await response.json();
                setStatus('health-status', 'success', '✓ Success');
                showResult('health-result', data);
            } catch (error) {
                setStatus('health-status', 'error', '✗ Error');
                showResult('health-result', null, { error: error.message });
            }
        }

        async function testSeasonsList() {
            setStatus('seasons-status', 'loading', 'Loading...');
            try {
                const response = await fetch(`${API_BASE}/api/seasons`);
                const data = await response.json();
                setStatus('seasons-status', 'success', `✓ ${data.length} seasons`);
                showResult('seasons-result', data);
            } catch (error) {
                setStatus('seasons-status', 'error', '✗ Error');
                showResult('seasons-result', null, { error: error.message });
            }
        }

        async function testSeasonSummary() {
            const seasonId = document.getElementById('season-id').value;
            setStatus('summary-status', 'loading', 'Loading...');
            try {
                const response = await fetch(`${API_BASE}/api/seasons/${seasonId}/summary`);
                const data = await response.json();
                setStatus('summary-status', 'success', '✓ Success');
                showResult('summary-result', data);
                
                // Visual display
                const visual = document.getElementById('summary-visual');
                visual.innerHTML = `
                    <div class="grid">
                        <div class="card"><h3>Teams</h3><p style="font-size: 2rem; font-weight: bold;">${data.teams || 0}</p></div>
                        <div class="card"><h3>Players</h3><p style="font-size: 2rem; font-weight: bold;">${data.players || 0}</p></div>
                        <div class="card"><h3>Matches</h3><p style="font-size: 2rem; font-weight: bold;">${data.matches || 0}</p></div>
                        <div class="card"><h3>K/D Ratio</h3><p style="font-size: 2rem; font-weight: bold;">${(data.kdRatio || 0).toFixed(2)}</p></div>
                        <div class="card"><h3>ADR</h3><p style="font-size: 2rem; font-weight: bold;">${(data.adrAvg || 0).toFixed(1)}</p></div>
                        <div class="card"><h3>Progress</h3><p style="font-size: 2rem; font-weight: bold;">${(data.finishedPercent || 0).toFixed(1)}%</p></div>
                    </div>
                `;
            } catch (error) {
                setStatus('summary-status', 'error', '✗ Error');
                showResult('summary-result', null, { error: error.message });
            }
        }

        async function testSeasonDivisions() {
            const seasonId = document.getElementById('divisions-season-id').value;
            setStatus('divisions-status', 'loading', 'Loading...');
            try {
                const response = await fetch(`${API_BASE}/api/seasons/${seasonId}/divisions`);
                const data = await response.json();
                setStatus('divisions-status', 'success', `✓ ${data.length} divisions`);
                showResult('divisions-result', data);
                
                // Auto-fill division ID from first result
                if (data.length > 0 && data[0].divisionId) {
                    document.getElementById('division-id').value = data[0].divisionId;
                }
            } catch (error) {
                setStatus('divisions-status', 'error', '✗ Error');
                showResult('divisions-result', null, { error: error.message });
            }
        }

        async function testDivisionStats() {
            const seasonId = document.getElementById('stats-season-id').value;
            const divisionId = document.getElementById('division-id').value;
            
            if (!divisionId) {
                alert('Please enter a Division ID (or load divisions first to auto-fill)');
                return;
            }
            
            setStatus('stats-status', 'loading', 'Loading...');
            try {
                const response = await fetch(`${API_BASE}/api/seasons/${seasonId}/divisions/${encodeURIComponent(divisionId)}/stats`);
                const data = await response.json();
                setStatus('stats-status', 'success', '✓ Success');
                showResult('stats-result', data);
            } catch (error) {
                setStatus('stats-status', 'error', '✗ Error');
                showResult('stats-result', null, { error: error.message });
            }
        }

        // Auto-test health on page load
        window.addEventListener('load', () => {
            testHealth();
        });
    </script>
</body>
</html>
