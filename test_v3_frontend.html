<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V3 API Test</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 20px; max-width: 1200px; margin: 0 auto; }
        h1 { color: #333; }
        .division { border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 8px; }
        .division h3 { margin: 0 0 10px 0; color: #0066cc; }
        .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .stat { background: #f5f5f5; padding: 8px; border-radius: 4px; }
        .stat strong { display: block; font-size: 0.9em; color: #666; }
        .error { color: red; padding: 20px; background: #fee; border-radius: 8px; }
        .success { color: green; padding: 20px; background: #efe; border-radius: 8px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1>V3 API Test - Season 11 Divisions</h1>
    <div id="status">Loading...</div>
    <div id="results"></div>

    <script>
        async function testV3API() {
            const statusDiv = document.getElementById('status');
            const resultsDiv = document.getElementById('results');
            
            try {
                // Test API endpoint
                const response = await fetch('http://localhost:8000/api/v3/divisions/11');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const divisions = await response.json();
                
                // Show success message
                statusDiv.innerHTML = `
                    <div class="success">
                        ✓ Successfully loaded ${divisions.length} divisions from V3 API
                        <br>Expected: 26 divisions (no duplicate playoff cards)
                        <br>Result: ${divisions.length === 26 ? '✓ PASS' : '✗ FAIL'}
                    </div>
                `;
                
                // Display first 5 divisions
                divisions.slice(0, 5).forEach(div => {
                    const divCard = document.createElement('div');
                    divCard.className = 'division';
                    divCard.innerHTML = `
                        <h3>Tier ${div.tier}: ${div.name}</h3>
                        <div class="stats">
                            <div class="stat">
                                <strong>Status</strong>
                                ${div.status}
                            </div>
                            <div class="stat">
                                <strong>Season Teams</strong>
                                ${div.season.teams}
                            </div>
                            <div class="stat">
                                <strong>Season Matches</strong>
                                ${div.season.matches_played} / ${div.season.matches_total}
                            </div>
                            <div class="stat">
                                <strong>Playoffs</strong>
                                ${div.playoffs.status} - ${div.playoffs.matches_played}/${div.playoffs.matches_total}
                            </div>
                        </div>
                    `;
                    resultsDiv.appendChild(divCard);
                });
                
                // Show summary for remaining
                const remaining = divisions.length - 5;
                if (remaining > 0) {
                    const summary = document.createElement('div');
                    summary.innerHTML = `<p><em>... and ${remaining} more divisions</em></p>`;
                    resultsDiv.appendChild(summary);
                }
                
            } catch (error) {
                statusDiv.innerHTML = `<div class="error">✗ Error: ${error.message}</div>`;
                console.error('API test failed:', error);
            }
        }
        
        // Run test on page load
        testV3API();
    </script>
</body>
</html>
