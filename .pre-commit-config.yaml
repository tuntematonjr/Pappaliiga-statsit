repos:
  - repo: local
    hooks:
      - id: build-js-bundle
        name: Build JS bundle
        entry: python scripts/build_js_bundle.py
        language: python
        pass_filenames: false
        files: ^frontend/(static/.*\.js|index\.html)$
        stages: [pre-commit]

      - id: vulture
        name: vulture
        entry: vulture .
        language: python
        types: [python]
        additional_dependencies:
          - vulture==2.11

