<!DOCTYPE html>
<html>
<head>
    <title>Diagnostic Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #fff; }
        pre { background: #000; padding: 15px; overflow-x: auto; white-space: pre-wrap; word-wrap: break-word; }
        .success { color: #4CAF50; }
        .error { color: #f44336; }
        button { padding: 10px 20px; margin: 10px 0; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Division Data Diagnostic</h1>
    <button onclick="runDiagnostic()">Run Diagnostic</button>
    <button onclick="window.location.href='http://localhost:8001'">Go to Main App</button>
    <div id="output"></div>

    <script>
        async function runDiagnostic() {
            const output = document.getElementById('output');
            output.innerHTML = '<h2>Running...</h2>';
            
            try {
                // Step 1: Fetch API data
                const resp = await fetch('http://localhost:8000/api/seasons/11/divisions');
                const divisions = await resp.json();
                
                output.innerHTML = `<h2 class="success">✓ API Response OK: ${divisions.length} divisions</h2>`;
                
                // Step 2: Check first division
                const first = divisions[0];
                output.innerHTML += `<h3>First Division:</h3><pre>${JSON.stringify(first, null, 2)}</pre>`;
                
                // Step 3: Simulate seasonRows logic
                const hasTeams = first.season?.teams > 0;
                const hasMatches = first.season?.matchesTotal > 0;
                const hasBestPlayer = Boolean(first.bestPlayer);
                const hasMvpTeam = Boolean(first.mvpTeam);
                
                output.innerHTML += `<h3>Computed Checks:</h3>`;
                output.innerHTML += `<p>hasTeams (teams > 0): <span class="${hasTeams ? 'success' : 'error'}">${hasTeams} (value: ${first.season?.teams})</span></p>`;
                output.innerHTML += `<p>hasMatches (matchesTotal > 0): <span class="${hasMatches ? 'success' : 'error'}">${hasMatches} (value: ${first.season?.matchesTotal})</span></p>`;
                output.innerHTML += `<p>hasBestPlayer: <span class="${hasBestPlayer ? 'success' : 'error'}">${hasBestPlayer} (value: ${JSON.stringify(first.bestPlayer)})</span></p>`;
                output.innerHTML += `<p>hasMvpTeam: <span class="${hasMvpTeam ? 'success' : 'error'}">${hasMvpTeam} (value: ${first.mvpTeam})</span></p>`;
                
                // Step 4: Count expected rows
                let expectedRows = 0;
                if (hasTeams) expectedRows++;
                if (hasMatches) expectedRows++;
                if (hasBestPlayer) expectedRows++;
                if (hasMvpTeam) expectedRows++;
                
                output.innerHTML += `<h3>Expected seasonRows.length: <span class="${expectedRows > 0 ? 'success' : 'error'}">${expectedRows}</span></h3>`;
                
                if (expectedRows === 0) {
                    output.innerHTML += `<h2 class="error">✗ PROBLEM: seasonRows would be EMPTY!</h2>`;
                    output.innerHTML += `<p>This means the UI won't show any stats for this division.</p>`;
                } else {
                    output.innerHTML += `<h2 class="success">✓ seasonRows should have ${expectedRows} items</h2>`;
                }
                
                // Step 5: Check localStorage cache
                const cacheKeys = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key && key.includes('pappaliiga') || key.includes('season') || key.includes('division')) {
                        cacheKeys.push(key);
                    }
                }
                
                if (cacheKeys.length > 0) {
                    output.innerHTML += `<h3>LocalStorage Cache Found:</h3>`;
                    output.innerHTML += `<p>Keys: ${cacheKeys.join(', ')}</p>`;
                    output.innerHTML += `<button onclick="localStorage.clear(); alert('Cache cleared!')">Clear Cache</button>`;
                }
                
            } catch (error) {
                output.innerHTML += `<h2 class="error">✗ ERROR: ${error.message}</h2>`;
                output.innerHTML += `<pre>${error.stack}</pre>`;
            }
        }
    </script>
</body>
</html>
